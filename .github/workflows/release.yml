name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows (x64)
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - name: Linux (x64)
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            app/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # ---------------- macOS ----------------
      - name: Import Apple certificate into temporary keychain
        if: runner.os == 'macOS'
        id: apple_cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set; building UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build engine sidecar (macOS, both arches + lipo universal)
        if: runner.os == 'macOS'
        run: |
          bash scripts/build-sidecar.sh aarch64-apple-darwin
          bash scripts/build-sidecar.sh x86_64-apple-darwin
          cd app/src-tauri/binaries
          lipo -create -output checkmydrive-engine-universal-apple-darwin \
            checkmydrive-engine-aarch64-apple-darwin \
            checkmydrive-engine-x86_64-apple-darwin
          lipo -info checkmydrive-engine-universal-apple-darwin
          ls -la

      - name: Fetch smartctl (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/ci/fetch-smartctl-macos.sh app/src-tauri/resources/smartctl 7.5
          lipo -info app/src-tauri/resources/smartctl

      - name: Sign smartctl (hardened runtime)
        if: runner.os == 'macOS' && steps.apple_cert.outputs.signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Tauri signs the app and externalBin sidecars, but not arbitrary bundle.resources
          # binaries; unsigned Mach-O files would fail notarization.
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" app/src-tauri/resources/smartctl
          codesign --verify --strict --verbose=2 app/src-tauri/resources/smartctl

      # ---------------- Windows ----------------
      - name: Build engine sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 x86_64-pc-windows-msvc

      - name: Fetch smartctl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/fetch-smartctl-windows.ps1 -Out app/src-tauri/resources/smartctl.exe -Version 7.5

      # ---------------- Linux ----------------
      - name: Build engine sidecar (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-sidecar.sh x86_64-unknown-linux-gnu

      # smartctl on Linux comes from the .deb "smartmontools" dependency.
      # tauri.conf.json bundle.resources must tolerate the missing file there (see report).

      # Signed + notarized build (macOS only, when APPLE_CERTIFICATE secret is set).
      - name: Build and release (signed)
        if: steps.apple_cert.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: CheckMyDrive v__VERSION__
          releaseBody: See the assets below to download CheckMyDrive for your platform.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      # Unsigned build: Windows, Linux, and macOS without certificate. No APPLE_* env at all.
      - name: Build and release (unsigned)
        if: steps.apple_cert.outputs.signed != 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: CheckMyDrive v__VERSION__
          releaseBody: See the assets below to download CheckMyDrive for your platform.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      # ---------------- Post-build bundle verification ----------------
      - name: Verify bundle (macOS)
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ steps.apple_cert.outputs.signed }}
        run: |
          set -euo pipefail
          APP="$(find app/src-tauri/target -type d -name 'CheckMyDrive.app' -path '*/release/bundle/macos/*' | head -n1)"
          if [ -z "$APP" ]; then echo "::error::CheckMyDrive.app not found"; exit 1; fi
          echo "App: $APP"
          ENGINE="$APP/Contents/MacOS/checkmydrive-engine"
          SMART="$APP/Contents/Resources/smartctl"
          for f in "$ENGINE" "$SMART"; do
            if [ ! -f "$f" ]; then echo "::error::Missing $f"; exit 1; fi
            ls -la "$f"
          done
          for f in "$ENGINE" "$SMART"; do
            ARCHS="$(lipo -archs "$f")"
            echo "$f archs: $ARCHS"
            case " $ARCHS " in *" x86_64 "*) ;; *) echo "::error::$f lacks x86_64"; exit 1;; esac
            case " $ARCHS " in *" arm64 "*) ;; *) echo "::error::$f lacks arm64"; exit 1;; esac
          done
          echo "--- checkmydrive-engine version ---"
          "$ENGINE" version
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl -a -vv "$APP" || echo "::warning::spctl assessment failed for $APP"
          fi

      - name: Verify bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # NSIS
          $nsis = Get-ChildItem -Path app/src-tauri/target -Recurse -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]release[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS setup .exe not found' }
          Write-Host "NSIS: $($nsis.FullName) ($($nsis.Length) bytes)"
          if ($nsis.Length -le 1MB) { throw "NSIS setup too small: $($nsis.Length) bytes" }

          # MSI
          $msi = Get-ChildItem -Path app/src-tauri/target -Recurse -Filter '*.msi' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]release[\\/]bundle[\\/]msi[\\/]' } | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found' }
          Write-Host "MSI: $($msi.FullName) ($($msi.Length) bytes)"
          $target = Join-Path $env:RUNNER_TEMP 'msi-extract'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target | Out-Null
          $p = Start-Process msiexec -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec administrative extract failed with exit code $($p.ExitCode)" }

          $engine = Get-ChildItem -Path $target -Recurse -Filter 'checkmydrive-engine.exe' -File | Select-Object -First 1
          $smart = Get-ChildItem -Path $target -Recurse -Filter 'smartctl.exe' -File | Select-Object -First 1
          if (-not $engine) { throw 'checkmydrive-engine.exe missing from MSI' }
          if (-not $smart) { throw 'smartctl.exe missing from MSI' }
          Write-Host "engine: $($engine.FullName) ($($engine.Length) bytes)"
          Write-Host "smartctl: $($smart.FullName) ($($smart.Length) bytes)"

          # PE header machine field
          $fs = [System.IO.File]::OpenRead($smart.FullName)
          try {
            $br = New-Object System.IO.BinaryReader($fs)
            $fs.Seek(0x3C, 'Begin') | Out-Null
            $peOffset = $br.ReadInt32()
            $fs.Seek($peOffset, 'Begin') | Out-Null
            $sig = $br.ReadUInt32()
            if ($sig -ne 0x00004550) { throw 'smartctl.exe: invalid PE signature' }
            $machine = $br.ReadUInt16()
          } finally { $fs.Dispose() }
          Write-Host ('smartctl.exe PE machine: 0x{0:X4}' -f $machine)
          if ($machine -ne 0x8664) { throw ('smartctl.exe is not 64-bit (machine 0x{0:X4})' -f $machine) }

          # Engine version
          $env:CHECKMYDRIVE_SMARTCTL = $smart.FullName
          Push-Location $engine.DirectoryName
          try {
            $out = & $engine.FullName version 2>&1 | Out-String
            Write-Host "engine version exit code: $LASTEXITCODE"
            Write-Host $out
          } finally { Pop-Location }
          $smartVer = $null
          try {
            $json = $out | ConvertFrom-Json
            $prop = $json.PSObject.Properties | Where-Object { $_.Name -match 'smartctl' } | Select-Object -First 1
            if ($prop) { $smartVer = $prop.Value }
          } catch { Write-Host "Could not parse version output as JSON: $_" }
          if (-not $smartVer) {
            Write-Host '::warning::checkmydrive-engine version did not report a smartctl version'
          }

      - name: Verify bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          DEB="$(find app/src-tauri/target -type f -name '*.deb' -path '*/release/bundle/deb/*' | head -n1)"
          if [ -z "$DEB" ]; then echo "::error::.deb not found"; exit 1; fi
          echo "Deb: $DEB"
          DEPENDS="$(dpkg-deb -f "$DEB" Depends)"
          echo "Depends: $DEPENDS"
          echo "$DEPENDS" | grep -q smartmontools || { echo "::error::Depends lacks smartmontools"; exit 1; }
          dpkg-deb -c "$DEB"
          CONTENTS="$(dpkg-deb -c "$DEB")"
          grep -Eq '(\./)?usr/bin/checkmydrive-engine$' <<<"$CONTENTS" || { echo "::error::usr/bin/checkmydrive-engine missing from .deb"; exit 1; }
