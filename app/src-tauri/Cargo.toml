[package]
name = "checkmydrive"
version = "0.1.0"
description = "Find out if a used drive is safe to buy or use"
authors = ["humza-sami"]
license = "MIT"
edition = "2021"

[lib]
name = "checkmydrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "fs", "io-util", "process"] }
