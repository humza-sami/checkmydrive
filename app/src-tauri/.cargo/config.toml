# Link the MSVC C runtime statically so the .exe runs on Windows installs that
# lack the Visual C++ Redistributable (e.g. fresh Windows 11 ARM64 running x64
# under emulation, where a missing VCRUNTIME140.dll makes the exe exit silently).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
